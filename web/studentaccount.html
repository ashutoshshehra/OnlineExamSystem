<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile & Account - SmartExam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-header">
        <div class="brand-group">
            <a href="studenthome.html" class="brand-logo"><i class="fa-solid fa-arrow-left"></i></a>
            <div>
                <div class="brand-title">Student Profile</div>
                <div class="brand-subtitle">Manage Account Details & Avatar</div>
            </div>
        </div>
        <nav class="nav-links">
            <a href="studenthome.html" class="btn btn-secondary"><i class="fa-solid fa-house"></i> Dashboard</a>
        </nav>
    </header>

    <main class="main-content">
        <div style="max-width: 650px; margin: 0 auto;">
            <div class="card">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <div id="avatarDisplay" style="width: 90px; height: 90px; border-radius: 50%; background: var(--accent-gradient); display: grid; place-items: center; color: white; font-size: 2.5rem; margin: 0 auto 12px; overflow: hidden; border: 3px solid rgba(255,255,255,0.2);">
                        <i class="fa-solid fa-user-graduate"></i>
                    </div>
                    <h2 id="nameHeading" style="font-size: 1.5rem; font-weight: 700;">Ashutosh Shehra</h2>
                    <p style="color: var(--text-muted); font-size: 0.9rem;" id="idHeading">Student ID: STU-2026</p>
                </div>

                <form id="profileForm" onsubmit="saveProfile(event)">
                    <div class="form-group">
                        <label>Profile Picture</label>
                        <input type="file" id="avatarInput" accept="image/*" onchange="previewAvatar(this)">
                    </div>

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="profName" required>
                    </div>

                    <div class="form-group">
                        <label>Student ID</label>
                        <input type="text" id="profId" required>
                    </div>

                    <div class="form-group">
                        <label>Enrolled Class / Academic Level</label>
                        <select id="profClass" required>
                            <option value="Class 5">Class 5</option>
                            <option value="Class 6">Class 6</option>
                            <option value="Class 7">Class 7</option>
                            <option value="Class 8">Class 8</option>
                            <option value="Class 9">Class 9</option>
                            <option value="Class 10">Class 10</option>
                            <option value="Class 11">Class 11</option>
                            <option value="Class 12">Class 12</option>
                            <option value="College / CS">College / CS (BCA/B.Tech)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="profEmail" required>
                    </div>

                    <div class="form-group">
                        <label>Update Password</label>
                        <input type="password" id="profPass" placeholder="Leave blank to keep unchanged">
                    </div>

                    <div style="text-align: right; margin-top: 1.5rem;">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Save Profile Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const student = getCurrentStudent();

        document.getElementById('profName').value = student.name || 'Ashutosh Shehra';
        document.getElementById('profId').value = student.studentId || 'STU-2026';
        document.getElementById('profClass').value = student.classGrade || 'Class 10';
        document.getElementById('profEmail').value = student.email || 'student@example.com';
        document.getElementById('nameHeading').textContent = student.name;
        document.getElementById('idHeading').textContent = `Student ID: ${student.studentId || 'STU-2026'}`;

        if (student.avatar) {
            document.getElementById('avatarDisplay').innerHTML = `<img src="${student.avatar}" style="width:100%; height:100%; object-fit:cover;">`;
        }

        let avatarBase64 = student.avatar || null;

        function previewAvatar(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                avatarBase64 = e.target.result;
                document.getElementById('avatarDisplay').innerHTML = `<img src="${avatarBase64}" style="width:100%; height:100%; object-fit:cover;">`;
            };
            reader.readAsDataURL(file);
        }

        function saveProfile(e) {
            e.preventDefault();
            const updated = {
                name: document.getElementById('profName').value.trim(),
                studentId: document.getElementById('profId').value.trim(),
                classGrade: document.getElementById('profClass').value,
                email: document.getElementById('profEmail').value.trim(),
                avatar: avatarBase64
            };

            saveCurrentStudent(updated);
            document.getElementById('nameHeading').textContent = updated.name;
            document.getElementById('idHeading').textContent = `Student ID: ${updated.studentId}`;
            showToast("Profile updated successfully!", "success");
        }
    </script>
</body>
</html>
