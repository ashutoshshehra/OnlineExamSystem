<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Assignments - SmartExam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-header">
        <div class="brand-group">
            <a href="teacherhome.html" class="brand-logo" style="background: linear-gradient(135deg, #8b5cf6, #ec4899);"><i class="fa-solid fa-arrow-left"></i></a>
            <div>
                <div class="brand-title">Assignment Management</div>
                <div class="brand-subtitle">Publish Class Projects & Review Submissions</div>
            </div>
        </div>
        <nav class="nav-links">
            <a href="teacherhome.html" class="btn btn-secondary"><i class="fa-solid fa-house"></i> Dashboard</a>
        </nav>
    </header>

    <main class="main-content">
        <!-- New Assignment Creation Card -->
        <div class="card" style="margin-bottom: 2.5rem;">
            <h2 style="font-size: 1.3rem; margin-bottom: 1.25rem;"><i class="fa-solid fa-plus-circle"></i> Create New Class Assignment</h2>
            <form id="newAssignForm" onsubmit="createAssignment(event)">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label>Assignment Title</label>
                        <input type="text" id="aTitle" required placeholder="e.g. Physics Laws of Motion Lab Report">
                    </div>
                    <div class="form-group">
                        <label>Target Class</label>
                        <select id="aClass" required>
                            <option value="Class 5">Class 5</option>
                            <option value="Class 6">Class 6</option>
                            <option value="Class 7">Class 7</option>
                            <option value="Class 8">Class 8</option>
                            <option value="Class 9">Class 9</option>
                            <option value="Class 10" selected>Class 10</option>
                            <option value="Class 11">Class 11</option>
                            <option value="Class 12">Class 12</option>
                            <option value="College / CS">College / CS</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="aSubject" required placeholder="e.g. Mathematics, Science, Java...">
                    </div>
                    <div class="form-group">
                        <label>Submission Due Date</label>
                        <input type="date" id="aDueDate" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Instructions / Description</label>
                    <textarea id="aDesc" rows="3" placeholder="Provide assignment instructions for students..." required></textarea>
                </div>
                <div style="text-align: right;">
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Publish Assignment</button>
                </div>
            </form>
        </div>

        <!-- Assignments Table -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2 style="font-size: 1.3rem;"><i class="fa-solid fa-list-check"></i> Published Assignments</h2>
            <button class="btn btn-secondary" onclick="renderTable()"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Subject</th>
                        <th>Target Class</th>
                        <th>Due Date</th>
                        <th>Submissions</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="teacherTableBody">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>

        <!-- Student Submissions Modal -->
        <div class="modal-overlay" id="subModal">
            <div class="modal-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3 style="font-size: 1.3rem;"><i class="fa-solid fa-users-viewfinder"></i> Student Submissions</h3>
                    <button class="btn btn-secondary" style="padding: 4px 10px;" onclick="closeSubModal()">&times;</button>
                </div>
                <div id="subListContainer" style="display: grid; gap: 12px;"></div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        function getAssignments() {
            let list = JSON.parse(localStorage.getItem('smartexam_assignments') || '[]');
            if (list.length === 0) {
                list = [
                    { id: 1, title: "Class 10 Trigonometry Problem Set", subject: "Mathematics", classGrade: "Class 10", dueDate: "2026-03-30", description: "Solve exercises 8.1 to 8.4 from NCERT textbook and write step-by-step proofs." },
                    { id: 2, title: "Class 10 Chemical Reactions Lab Report", subject: "Science", classGrade: "Class 10", dueDate: "2026-04-05", description: "Document observations of copper sulphate and iron nail displacement reaction." },
                    { id: 3, title: "College CS: Java Servlet Architecture Report", subject: "Java Programming", classGrade: "College / CS", dueDate: "2026-04-10", description: "Explain HttpServletRequest, response cycle, and session management." }
                ];
                localStorage.setItem('smartexam_assignments', JSON.stringify(list));
            }
            return list;
        }

        function getSubmissions() {
            let subs = JSON.parse(localStorage.getItem('smartexam_submissions') || '[]');
            if (subs.length === 0) {
                subs = [
                    { assignmentId: 1, student: "Ashutosh Shehra", fileName: "trigonometry_proofs.pdf", submittedAt: "2026-03-21 10:45 AM", notes: "Complete with graphs.", grade: "A+" }
                ];
                localStorage.setItem('smartexam_submissions', JSON.stringify(subs));
            }
            return subs;
        }

        function renderTable() {
            const list = getAssignments();
            const subs = getSubmissions();
            const tbody = document.getElementById('teacherTableBody');

            tbody.innerHTML = list.map(a => {
                const subCount = subs.filter(s => s.assignmentId == a.id).length;
                return `
                    <tr>
                        <td style="font-weight: 600;">${a.title}</td>
                        <td>${a.subject}</td>
                        <td><span class="badge badge-accent">${a.classGrade || 'Class 10'}</span></td>
                        <td>${a.dueDate}</td>
                        <td><strong>${subCount}</strong> Submissions</td>
                        <td>
                            <button class="btn btn-secondary" style="padding: 4px 12px; font-size: 0.85rem;" onclick="viewSubmissions(${a.id})">
                                <i class="fa-solid fa-folder-open"></i> Review
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function viewSubmissions(id) {
            const subs = getSubmissions().filter(s => s.assignmentId == id);
            const container = document.getElementById('subListContainer');

            if (subs.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted);">No student has submitted this assignment yet.</div>';
            } else {
                container.innerHTML = subs.map(s => `
                    <div class="card" style="padding: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                        <div>
                            <strong style="font-size: 1.05rem;">${s.student}</strong><br>
                            <small style="color: var(--text-muted);"><i class="fa-solid fa-file-pdf"></i> ${s.fileName || 'Solution.pdf'} &bull; Submitted: ${s.submittedAt || 'N/A'}</small>
                            ${s.notes ? `<div style="font-size: 0.85rem; color: #cbd5e1; margin-top: 4px;">Note: "${s.notes}"</div>` : ''}
                        </div>
                        <div>
                            <span class="badge badge-success">${s.grade || 'Submitted'}</span>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('subModal').style.display = 'grid';
        }

        function closeSubModal() {
            document.getElementById('subModal').style.display = 'none';
        }

        function createAssignment(e) {
            e.preventDefault();
            const list = getAssignments();
            list.push({
                id: Date.now(),
                title: document.getElementById('aTitle').value.trim(),
                classGrade: document.getElementById('aClass').value,
                subject: document.getElementById('aSubject').value.trim(),
                dueDate: document.getElementById('aDueDate').value,
                description: document.getElementById('aDesc').value.trim()
            });

            localStorage.setItem('smartexam_assignments', JSON.stringify(list));
            showToast("Assignment published to students!", "success");
            document.getElementById('newAssignForm').reset();
            renderTable();
        }

        renderTable();
    </script>
</body>
</html>
