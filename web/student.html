<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - SmartExam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 480px;
            margin: 2rem auto;
        }
        .tab-nav {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            color: #ffffff;
            border-bottom-color: var(--primary-light);
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand-group">
            <a href="start.html" class="brand-logo"><i class="fa-solid fa-arrow-left"></i></a>
            <div>
                <div class="brand-title">Student Portal</div>
                <div class="brand-subtitle">Smart Examination Access</div>
            </div>
        </div>
        <a href="start.html" class="btn btn-secondary"><i class="fa-solid fa-home"></i> Home</a>
    </header>

    <main class="main-content">
        <div class="auth-container">
            <div class="card">
                <div class="tab-nav">
                    <button class="tab-btn active" id="tabLoginBtn" type="button" onclick="switchTab('login')">
                        <i class="fa-solid fa-right-to-bracket"></i> Sign In
                    </button>
                    <button class="tab-btn" id="tabRegisterBtn" type="button" onclick="switchTab('register')">
                        <i class="fa-solid fa-user-plus"></i> New Student
                    </button>
                </div>

                <!-- LOGIN FORM -->
                <form id="loginForm" onsubmit="return handleStudentAuth(event, 'login')">
                    <div class="form-group">
                        <label><i class="fa-solid fa-envelope"></i> Student Email</label>
                        <input type="email" id="loginEmail" required placeholder="student@example.com" value="student@example.com">
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-lock"></i> Password</label>
                        <input type="password" id="loginPassword" required placeholder="••••••••" value="student123">
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <button type="button" class="btn btn-secondary" style="font-size: 0.8rem; padding: 6px 12px;" onclick="fillDemoStudent()">
                            <i class="fa-solid fa-key"></i> Auto-Fill Demo
                        </button>
                        <span style="font-size: 0.82rem; color: var(--text-muted);">student@example.com / student123</span>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fa-solid fa-arrow-right"></i> Login to Dashboard
                    </button>
                </form>

                <!-- REGISTRATION FORM -->
                <form id="registerForm" onsubmit="return handleStudentAuth(event, 'register')" style="display: none;">
                    <div class="form-group">
                        <label><i class="fa-solid fa-user"></i> Full Name</label>
                        <input type="text" id="regName" required placeholder="Ashutosh Shehra">
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-id-card"></i> Student ID</label>
                        <input type="text" id="regStudentId" required placeholder="STU-2026" value="STU-2026">
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-graduation-cap"></i> Select Class / Grade</label>
                        <select id="regClass" required>
                            <option value="Class 5">Class 5</option>
                            <option value="Class 6">Class 6</option>
                            <option value="Class 7">Class 7</option>
                            <option value="Class 8">Class 8</option>
                            <option value="Class 9">Class 9</option>
                            <option value="Class 10" selected>Class 10</option>
                            <option value="Class 11">Class 11</option>
                            <option value="Class 12">Class 12</option>
                            <option value="College / CS">College / CS (BCA/B.Tech)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-envelope"></i> Email Address</label>
                        <input type="email" id="regEmail" required placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-lock"></i> Password</label>
                        <input type="password" id="regPass" required placeholder="Create password">
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-shield"></i> Confirm Password</label>
                        <input type="password" id="regConfirm" required placeholder="Re-enter password">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fa-solid fa-user-check"></i> Register Account
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');

            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLoginBtn.classList.add('active');
                tabRegisterBtn.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabLoginBtn.classList.remove('active');
                tabRegisterBtn.classList.add('active');
            }
        }

        function fillDemoStudent() {
            document.getElementById('loginEmail').value = 'student@example.com';
            document.getElementById('loginPassword').value = 'student123';
            showToast("Demo student credentials loaded!", "success");
        }
    </script>
</body>
</html>
