<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Account - SmartExam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-header">
        <div class="brand-group">
            <a href="teacherhome.html" class="brand-logo" style="background: linear-gradient(135deg, #8b5cf6, #ec4899);"><i class="fa-solid fa-arrow-left"></i></a>
            <div>
                <div class="brand-title">Teacher Account</div>
                <div class="brand-subtitle">Profile & Security Settings</div>
            </div>
        </div>
        <nav class="nav-links">
            <a href="teacherhome.html" class="btn btn-secondary"><i class="fa-solid fa-house"></i> Dashboard</a>
        </nav>
    </header>

    <main class="main-content">
        <div style="max-width: 650px; margin: 0 auto;">
            <div class="card">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <div id="teacherAvatarDisplay" style="width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #ec4899); display: grid; place-items: center; color: white; font-size: 2.5rem; margin: 0 auto 12px; overflow: hidden; border: 3px solid rgba(255,255,255,0.2);">
                        <i class="fa-solid fa-chalkboard-user"></i>
                    </div>
                    <h2 id="tNameHeading" style="font-size: 1.5rem; font-weight: 700;">Dr. Rajesh Sharma</h2>
                    <p style="color: var(--text-muted); font-size: 0.9rem;" id="tIdHeading">Teacher ID: T-101</p>
                </div>

                <form onsubmit="return handleTeacherProfile(event)">
                    <div class="form-group">
                        <label>Profile Picture</label>
                        <input type="file" name="avatar" accept="image/*" onchange="previewTeacherAvatar(this)">
                    </div>

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="name" id="tName" value="Dr. Rajesh Sharma" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" id="tEmail" value="admin@example.com" required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" name="phone" id="tPhone" value="+91 9876543210">
                    </div>

                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" name="password" placeholder="Leave blank to keep unchanged">
                    </div>

                    <div style="text-align: right; margin-top: 1.5rem;">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Save Profile Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const teacher = getTeacher();
        document.getElementById('tName').value = teacher.name || 'Dr. Rajesh Sharma';
        document.getElementById('tEmail').value = teacher.email || 'admin@example.com';
        document.getElementById('tPhone').value = teacher.phone || '+91 9876543210';
        document.getElementById('tNameHeading').textContent = teacher.name;
        document.getElementById('tIdHeading').textContent = `Teacher ID: ${teacher.teacherId || 'T-101'}`;

        if (teacher.avatar) {
            document.getElementById('teacherAvatarDisplay').innerHTML = `<img src="${teacher.avatar}" style="width:100%; height:100%; object-fit:cover;">`;
        }

        function previewTeacherAvatar(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                window.teacherAvatarBase64 = e.target.result;
                document.getElementById('teacherAvatarDisplay').innerHTML = `<img src="${e.target.result}" style="width:100%; height:100%; object-fit:cover;">`;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
