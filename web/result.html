<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Results & Certificates - SmartExam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="app-header">
        <div class="brand-group">
            <a href="studenthome.html" class="brand-logo"><i class="fa-solid fa-arrow-left"></i></a>
            <div>
                <div class="brand-title">Results & Certificates</div>
                <div class="brand-subtitle">Performance History & Verifiable Credentials</div>
            </div>
        </div>
        <nav class="nav-links">
            <a href="studenthome.html" class="btn btn-secondary"><i class="fa-solid fa-house"></i> Dashboard</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Your Assessment Results</h1>
                <p class="page-desc">Review your previous examination scores, download certificates, and analyze your progress.</p>
            </div>
            <button class="btn btn-secondary" onclick="exportResultsCSV()"><i class="fa-solid fa-download"></i> Export Results CSV</button>
        </div>

        <!-- Result History Table -->
        <div class="table-container" style="margin-bottom: 2.5rem;">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Exam Title</th>
                        <th>Subject</th>
                        <th>Score</th>
                        <th>Percentage</th>
                        <th>Status</th>
                        <th>Proctor Strikes</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="resultsTableBody">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>

        <!-- Certificate Container (When triggered) -->
        <div id="certContainer" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 style="font-size: 1.5rem; font-weight: 700;"><i class="fa-solid fa-award"></i> Certificate Preview</h2>
                <button class="btn btn-secondary" onclick="document.getElementById('certContainer').style.display='none'">Close Certificate</button>
            </div>
            <div id="certificateWrapper"></div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const student = getCurrentStudent();

        function renderResults() {
            const tbody = document.getElementById('resultsTableBody');
            const results = API.getLocalResults();

            if (!results || results.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 40px; color: var(--text-muted);">
                            No exam attempts recorded yet. Take an exam to earn your certificate!
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = results.map((r, i) => {
                const dateStr = r.date ? new Date(r.date).toLocaleDateString() : 'Recent';
                const isPass = r.percentage >= 40;
                return `
                    <tr>
                        <td>${dateStr}</td>
                        <td style="font-weight: 600;">${r.examTitle || 'Exam Attempt'}</td>
                        <td>${r.subject || 'General'}</td>
                        <td><strong>${r.score}</strong> / ${r.totalMarks}</td>
                        <td><strong>${r.percentage}%</strong></td>
                        <td><span class="badge ${isPass ? 'badge-success' : 'badge-danger'}">${r.status || (isPass ? 'PASS' : 'FAIL')}</span></td>
                        <td><span style="color: ${r.tabSwitchCount > 0 ? '#fbbf24' : 'var(--text-muted)'};">${r.tabSwitchCount || 0}</span></td>
                        <td>
                            <button class="btn btn-secondary" style="padding: 4px 12px; font-size: 0.8rem;" onclick="viewCert(${i})">
                                <i class="fa-solid fa-certificate"></i> Certificate
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function viewCert(index) {
            const results = API.getLocalResults();
            const r = results[index];
            if (!r) return;

            const dateStr = r.date ? new Date(r.date).toLocaleDateString() : new Date().toLocaleDateString();
            const wrapper = document.getElementById('certificateWrapper');
            wrapper.innerHTML = generateCertificateHTML(r.student || student.name, r.examTitle, r.score, r.totalMarks, r.percentage, dateStr);

            document.getElementById('certContainer').style.display = 'block';
            document.getElementById('certContainer').scrollIntoView({ behavior: 'smooth' });

            // Render QR code
            setTimeout(() => {
                renderSimpleQR('certQrCanvas', `SMARTEXAM-VERIFIED-${r.student}-${r.score}`);
            }, 100);
        }

        function exportResultsCSV() {
            const results = API.getLocalResults();
            if (!results || results.length === 0) {
                showToast("No results available to export!", "warning");
                return;
            }
            let csv = "Date,Exam Title,Subject,Student,Score,Total Marks,Percentage,Status,Tab Switches\n";
            results.forEach(r => {
                csv += `"${r.date || ''}","${r.examTitle || ''}","${r.subject || ''}","${r.student || ''}",${r.score},${r.totalMarks},${r.percentage},"${r.status}",${r.tabSwitchCount || 0}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `my_exam_results_${Date.now()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("CSV report downloaded!", "success");
        }

        renderResults();

        // Check if specific exam requested via URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('examId')) {
            setTimeout(() => viewCert(0), 200);
        }
    </script>
</body>
</html>
