<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Exam Builder - SmartExam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .question-card-edit {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            position: relative;
        }
        .ai-banner-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.3);
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand-group">
            <a href="teacherhome.html" class="brand-logo" style="background: linear-gradient(135deg, #8b5cf6, #ec4899);"><i class="fa-solid fa-arrow-left"></i></a>
            <div>
                <div class="brand-title">AI Exam Builder</div>
                <div class="brand-subtitle">Create or AI-Generate Curriculum Assessments</div>
            </div>
        </div>
        <nav class="nav-links">
            <a href="teacherhome.html" class="btn btn-secondary"><i class="fa-solid fa-house"></i> Dashboard</a>
        </nav>
    </header>

    <main class="main-content">
        <!-- AI Generator Highlight Banner -->
        <div class="ai-banner-btn">
            <div>
                <h2 style="font-size: 1.4rem; color: white; margin-bottom: 4px;">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Need Instant Questions? Generate with AI!
                </h2>
                <p style="color: rgba(255,255,255,0.9); font-size: 0.92rem;">
                    Enter any curriculum topic and AI will create questions with options, answers, and explanations automatically.
                </p>
            </div>
            <button class="btn btn-primary" style="background: #ffffff; color: #1e1b4b; font-weight: 800;" onclick="openAIModal()">
                <i class="fa-solid fa-bolt"></i> Launch AI Question Assistant
            </button>
        </div>

        <form id="createExamForm" onsubmit="saveExam(event)">
            <!-- Exam Basic Information -->
            <div class="card" style="margin-bottom: 2rem;">
                <h3 style="font-size: 1.25rem; margin-bottom: 1.25rem;"><i class="fa-solid fa-sliders"></i> Exam Settings</h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label>Exam Title</label>
                        <input type="text" id="examTitle" required placeholder="e.g. Unit Test: Optics & Waves">
                    </div>
                    <div class="form-group">
                        <label>Target Academic Class</label>
                        <select id="examClass" required>
                            <option value="Class 5">Class 5</option>
                            <option value="Class 6">Class 6</option>
                            <option value="Class 7">Class 7</option>
                            <option value="Class 8">Class 8</option>
                            <option value="Class 9">Class 9</option>
                            <option value="Class 10" selected>Class 10</option>
                            <option value="Class 11">Class 11</option>
                            <option value="Class 12">Class 12</option>
                            <option value="College / CS">College / CS</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="examSubject" required placeholder="e.g. Physics, Science, Java...">
                    </div>
                    <div class="form-group">
                        <label>Duration (Minutes)</label>
                        <input type="number" id="examDuration" value="30" min="5" max="180" required>
                    </div>
                </div>
            </div>

            <!-- Questions List -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="font-size: 1.3rem;"><i class="fa-solid fa-list-ol"></i> Exam Questions (<span id="qCountLabel">0</span>)</h3>
                <div style="display: flex; gap: 8px;">
                    <button type="button" class="btn btn-secondary" onclick="addBlankQuestion()"><i class="fa-solid fa-plus"></i> Add Question</button>
                    <label class="btn btn-secondary" style="margin: 0; cursor: pointer;">
                        <i class="fa-solid fa-file-csv"></i> Bulk CSV Upload
                        <input type="file" accept=".csv" style="display: none;" onchange="handleCSVUpload(this)">
                    </label>
                </div>
            </div>

            <div id="questionsContainer">
                <!-- Dynamically added question cards -->
            </div>

            <div style="text-align: right; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="padding: 14px 32px; font-size: 1.05rem;">
                    <i class="fa-solid fa-floppy-disk"></i> Publish & Save Examination
                </button>
            </div>
        </form>

        <!-- AI GENERATION MODAL -->
        <div class="modal-overlay" id="aiModal">
            <div class="modal-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3 style="font-size: 1.3rem; color: #f472b6;"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Question Generator</h3>
                    <button class="btn btn-secondary" style="padding: 4px 10px;" onclick="closeAIModal()">&times;</button>
                </div>

                <div class="form-group">
                    <label>Target Academic Class</label>
                    <select id="aiClass">
                        <option value="Class 5">Class 5</option>
                        <option value="Class 6">Class 6</option>
                        <option value="Class 7">Class 7</option>
                        <option value="Class 8">Class 8</option>
                        <option value="Class 9">Class 9</option>
                        <option value="Class 10" selected>Class 10</option>
                        <option value="Class 11">Class 11</option>
                        <option value="Class 12">Class 12</option>
                        <option value="College / CS">College / CS</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="aiSubject" placeholder="e.g. Science, Mathematics, Java Programming" value="Science">
                </div>

                <div class="form-group">
                    <label>Topic / Concept Keyword</label>
                    <input type="text" id="aiTopic" placeholder="e.g. Chemical Reactions, Trigonometry, Electric Current..." required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group">
                        <label>Difficulty</label>
                        <select id="aiDiff">
                            <option value="easy">Easy</option>
                            <option value="medium" selected>Medium</option>
                            <option value="hard">Hard (Advanced)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Question Count</label>
                        <input type="number" id="aiCount" value="5" min="1" max="15">
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeAIModal()">Cancel</button>
                    <button type="button" class="btn btn-ai" onclick="runAIGeneration()">
                        <i class="fa-solid fa-sparkles"></i> Generate & Insert into Exam
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        let questionIndex = 0;

        function openAIModal() { document.getElementById('aiModal').style.display = 'grid'; }
        function closeAIModal() { document.getElementById('aiModal').style.display = 'none'; }

        function runAIGeneration() {
            const cls = document.getElementById('aiClass').value;
            const sub = document.getElementById('aiSubject').value;
            const topic = document.getElementById('aiTopic').value.trim();
            const diff = document.getElementById('aiDiff').value;
            const count = Number(document.getElementById('aiCount').value) || 5;

            if (!topic) {
                showToast("Please enter a topic name!", "warning");
                return;
            }

            const generated = AIEngine.generateQuestions(cls, sub, topic, diff, count);
            
            // Populate exam settings if blank
            if (!document.getElementById('examTitle').value) {
                document.getElementById('examTitle').value = `${sub}: ${topic} Test`;
            }
            document.getElementById('examClass').value = cls;
            document.getElementById('examSubject').value = sub;

            // Append to question list
            generated.forEach(q => {
                addQuestionCard(q.text, q.options[0], q.options[1], q.options[2], q.options[3], q.correct, q.explanation, q.marks);
            });

            closeAIModal();
            showToast(`✨ Generated and added ${generated.length} questions!`, "success");
        }

        function addBlankQuestion() {
            addQuestionCard("", "", "", "", "", "A", "", 5);
        }

        function addQuestionCard(text, opA, opB, opC, opD, correct, explanation, marks) {
            questionIndex++;
            const idx = questionIndex;
            const container = document.getElementById('questionsContainer');

            const card = document.createElement('div');
            card.className = 'question-card-edit';
            card.id = `qCard_${idx}`;

            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                    <strong style="color: var(--primary-light);">Question ${idx}</strong>
                    <button type="button" class="btn btn-secondary" style="padding: 4px 10px; color: #f87171;" onclick="document.getElementById('qCard_${idx}').remove(); updateCount();">
                        <i class="fa-solid fa-trash"></i> Remove
                    </button>
                </div>
                <div class="form-group">
                    <label>Question Text</label>
                    <textarea class="q-text" rows="2" required placeholder="Write question statement here...">${text || ''}</textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group"><label>Option A</label><input type="text" class="q-opA" value="${opA || ''}" required placeholder="Option A"></div>
                    <div class="form-group"><label>Option B</label><input type="text" class="q-opB" value="${opB || ''}" required placeholder="Option B"></div>
                    <div class="form-group"><label>Option C</label><input type="text" class="q-opC" value="${opC || ''}" required placeholder="Option C"></div>
                    <div class="form-group"><label>Option D</label><input type="text" class="q-opD" value="${opD || ''}" required placeholder="Option D"></div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>Correct Answer Key</label>
                        <select class="q-correct">
                            <option value="A" ${correct === 'A' ? 'selected' : ''}>A</option>
                            <option value="B" ${correct === 'B' ? 'selected' : ''}>B</option>
                            <option value="C" ${correct === 'C' ? 'selected' : ''}>C</option>
                            <option value="D" ${correct === 'D' ? 'selected' : ''}>D</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Marks</label>
                        <input type="number" class="q-marks" value="${marks || 5}" min="1">
                    </div>
                </div>
                <div class="form-group">
                    <label>Explanation / Solution</label>
                    <input type="text" class="q-exp" value="${explanation || ''}" placeholder="Explain why the answer is correct...">
                </div>
            `;
            container.appendChild(card);
            updateCount();
        }

        function updateCount() {
            const count = document.querySelectorAll('.question-card-edit').length;
            document.getElementById('qCountLabel').textContent = count;
        }

        function handleCSVUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const lines = e.target.result.split('\n');
                let added = 0;
                lines.forEach((line, i) => {
                    if (i === 0 || !line.trim()) return; // skip header
                    const parts = line.split(',');
                    if (parts.length >= 6) {
                        addQuestionCard(parts[0], parts[1], parts[2], parts[3], parts[4], parts[5].trim().toUpperCase(), parts[6] || "", 5);
                        added++;
                    }
                });
                showToast(`Imported ${added} questions from CSV!`, "success");
            };
            reader.readAsText(file);
        }

        function saveExam(e) {
            e.preventDefault();
            const cards = document.querySelectorAll('.question-card-edit');
            if (cards.length === 0) {
                showToast("Please add at least one question!", "warning");
                return;
            }

            const questions = Array.from(cards).map((card, i) => ({
                id: i + 1,
                text: card.querySelector('.q-text').value.trim(),
                options: [
                    card.querySelector('.q-opA').value.trim(),
                    card.querySelector('.q-opB').value.trim(),
                    card.querySelector('.q-opC').value.trim(),
                    card.querySelector('.q-opD').value.trim()
                ],
                correct: card.querySelector('.q-correct').value,
                explanation: card.querySelector('.q-exp').value.trim(),
                marks: Number(card.querySelector('.q-marks').value) || 5
            }));

            const totalMarks = questions.reduce((acc, q) => acc + q.marks, 0);
            const newExam = {
                id: Date.now(),
                title: document.getElementById('examTitle').value.trim(),
                classGrade: document.getElementById('examClass').value,
                subject: document.getElementById('examSubject').value.trim(),
                durationMinutes: Number(document.getElementById('examDuration').value) || 30,
                totalMarks: totalMarks,
                passingMarks: Math.round(totalMarks * 0.4),
                questions: questions
            };

            // Save to custom tests list
            const custom = JSON.parse(localStorage.getItem('smartexam_custom_tests') || '[]');
            custom.push(newExam);
            localStorage.setItem('smartexam_custom_tests', JSON.stringify(custom));

            // Also push to curriculum in memory
            CURRICULUM_DATA.push(newExam);

            alert("Exam published successfully! Students can now take this examination.");
            window.location.href = "teacherhome.html";
        }

        // Start with 1 blank question
        addBlankQuestion();
    </script>
</body>
</html>
