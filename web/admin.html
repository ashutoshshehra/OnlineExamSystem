<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher & Admin Portal - SmartExam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 500px;
            margin: 2rem auto;
        }
        .tab-nav {
            display: flex;
            border-bottom: 1px solid var(--panel-border);
            margin-bottom: 1.5rem;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            color: #ffffff;
            border-bottom-color: #ec4899;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand-group">
            <a href="start.html" class="brand-logo" style="background: linear-gradient(135deg, #8b5cf6, #ec4899);"><i class="fa-solid fa-arrow-left"></i></a>
            <div>
                <div class="brand-title">Teacher & Admin Portal</div>
                <div class="brand-subtitle">Exam Management, AI Generator & Analytics</div>
            </div>
        </div>
        <a href="start.html" class="btn btn-secondary"><i class="fa-solid fa-home"></i> Home</a>
    </header>

    <main class="main-content">
        <div class="auth-container">
            <div class="card">
                <div class="tab-nav">
                    <button class="tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">
                        <i class="fa-solid fa-lock"></i> Teacher Login
                    </button>
                    <button class="tab-btn" id="tabRegisterBtn" onclick="switchTab('register')">
                        <i class="fa-solid fa-user-tie"></i> Register
                    </button>
                </div>

                <!-- LOGIN FORM -->
                <form id="loginForm" onsubmit="return handleAdminAuth(event, 'login')">
                    <div class="form-group">
                        <label><i class="fa-solid fa-envelope"></i> Teacher / Admin Email</label>
                        <input type="email" name="email" id="loginEmail" required placeholder="admin@example.com" value="admin@example.com">
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-lock"></i> Password</label>
                        <input type="password" name="password" id="loginPassword" required placeholder="••••••••" value="admin123">
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <button type="button" class="btn btn-secondary" style="font-size: 0.8rem; padding: 6px 12px;" onclick="fillDemoAdmin()">
                            <i class="fa-solid fa-key"></i> Use Demo Teacher
                        </button>
                        <span style="font-size: 0.85rem; color: var(--text-muted);">admin@example.com / admin123</span>
                    </div>
                    <button type="submit" class="btn btn-ai" style="width: 100%;">
                        <i class="fa-solid fa-arrow-right"></i> Login to Teacher Dashboard
                    </button>
                </form>

                <!-- REGISTRATION FORM -->
                <form id="registerForm" onsubmit="return handleAdminAuth(event, 'register')" style="display: none;">
                    <div class="form-group">
                        <label><i class="fa-solid fa-user-tie"></i> Full Name</label>
                        <input type="text" id="regAdminName" name="name" required placeholder="Dr. Rajesh Sharma" value="Dr. Rajesh Sharma">
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-id-card"></i> Teacher / Employee ID</label>
                        <input type="text" id="regAdminId" name="adminId" required placeholder="T-101" value="T-101">
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-envelope"></i> Email Address</label>
                        <input type="email" id="regAdminEmail" name="email" required placeholder="teacher@example.com">
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-lock"></i> Password</label>
                        <input type="password" id="regAdminPass" name="password" required placeholder="Create password">
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-shield"></i> Confirm Password</label>
                        <input type="password" id="regAdminConfirm" name="confirmPassword" required placeholder="Re-enter password">
                    </div>
                    <button type="submit" class="btn btn-ai" style="width: 100%;">
                        <i class="fa-solid fa-user-check"></i> Register Teacher Account
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');

            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLoginBtn.classList.add('active');
                tabRegisterBtn.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabLoginBtn.classList.remove('active');
                tabRegisterBtn.classList.add('active');
            }
        }

        function fillDemoAdmin() {
            document.getElementById('loginEmail').value = 'admin@example.com';
            document.getElementById('loginPassword').value = 'admin123';
            showToast("Demo teacher credentials filled!", "success");
        }
    </script>
</body>
</html>
